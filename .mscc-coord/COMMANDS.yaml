commands:
  - id: cmd-026
    created: "2026-09-21T13:10:00-04:00"
    target: [windows-new-hp]
    role: client
    action: digu-band-last-used-wins-over-last-hf
    status_hint: pending
    detail: |
      Host: windows-new-hp. Checkout: C:\Users\n8vet\OneDrive\Documents\GitHub\mscc-station
      Orders on this host. WPF MainViewModel (+ SpectrumWaterfallSettings if needed).
      Tightens cmd-025 DIG-U overlay — stop LAST_HF ping-pong.

      ## Problem (Stew 2026-09-21 after cmd-025 / 9.21.5)
      DIG-U restore works, AM still OK. But when band last-used is USB, DIG-U still
      overwrites after restart. Confirmed INI:
        20M_MODE=USB
        LAST_HF_MODE=DIG-U  (stale personality)
      Log: ModeReported USB deferred → FrequencyReported → "DIG-U overlay restore"
      because ShouldKeepDigUOnUsbReport fell through to LastHfMode=DIG-U even though
      per-band last-used said USB.

      ## Precedence (agreed)
      1. If this band has a last-used MODE string → that alone decides DIG-U keep/restore.
         DIG-U overlay only when band mode is DIG-U. USB/AM/LSB/CW stay as saved.
      2. Consult LAST_HF_MODE / LAST_LF_MODE for DIG-U ONLY when band is unknown OR
         band last-used mode is empty/missing.
      3. Bonus: when user selects a mode (USB/AM/DIG-U/etc) while live, also update
         LAST_HF_MODE or LAST_LF_MODE (RememberLastPersonalityFreq / equivalent) so
         personality does not lag behind band last-used.

      ## Implementation guidance
      - ShouldKeepDigUOnUsbReport / TryRestoreDigUAfterFreqKnown: if band resolved and
        LoadLastUsedForBand returns a non-empty mode, return DigU iff that mode is DigU;
        do NOT then OR with LastHfMode/LastLfMode.
      - Only if band missing or mode empty: fall back to LastHfMode/LastLfMode via
        IsLfPersonalityFreq(freq).
      - Defer USB ModeReported path from cmd-025 stays.
      - Do not LoadLastUsed from report handlers.
      - Bump ClientVersion 9.21.5 → 9.21.6

      ## Verify
      1) Set 20m DIG-U, restart → DIG-U (band DIG-U wins).
      2) Set 20m USB, restart → USB (must NOT restore DIG-U from stale LAST_HF).
         Optionally confirm LAST_HF_MODE becomes USB after selecting USB.
      3) AM still loads from wire as before.
      4) cmd-024 idle (freq 0 / no band) still OK.

      Commit hint: cmd-026: DIG-U overlay uses band last-used over LAST_HF

      ## Out of scope
      Avalonia; remote mic slider.
  - id: cmd-024
    created: "2026-09-21T11:55:00-04:00"
    target: [windows-new-hp]
    role: client
    action: idle-ui-no-default-40m-usb-poison
    status_hint: pending
    detail: |
      Host: windows-new-hp. Checkout: C:\Users\n8vet\OneDrive\Documents\GitHub\mscc-station
      Orders on this host. WPF (+ shared Core domain defaults). Builds on cmd-023 DIG-U stick.

      ## Problem (Stew 2026-09-21, Shack logs)
      Before Start, UI paints VFO A = 7.100 MHz, CurrentBand = 40m, mode = USB.
      Startup then SaveLastUsed three times (mscc.log) and poisons:
        40M_FREQ=7100000 / 40M_MODE=USB
        LAST_HF_FREQ=7100000 / LAST_HF_MODE=USB
      User set all bands to DIG-U; on reload previous band / 40m come back as USB
      because the idle default overwrote last-used. Other bands in MSCC_LastUsed.ini
      still show DIG-U; 40m was the victim.

      ## Desired UX (Stew)
      When MSCC loads (before Start): frequency all 0s, **no** band button highlighted,
      **no** mode button highlighted. Do not write last-used / LAST_HF/LF until the
      session is live (server freq/mode or user action after Start).

      After Start/Connect: normal path — FrequencyReported / startup band / LoadLastUsed
      apply real freq, band gold, mode (incl. DIG-U stick from cmd-023).

      ## Implementation guidance
      Shared defaults (MSCC.Core):
        VfoState: FrequencyHz default 0 (not 7_100_000); Mode must not force a lit
          mode button while idle — prefer an unset/None if enum allows, or document
          how ActiveMode binding shows no selection when idle (freq==0 / not running).
        RadioState: VfoA/VfoB FrequencyHz 0; CurrentBand "" (not "40m").

      WPF:
        UpdateBandButtonVisuals already lights none when CurrentBand empty — good.
        Mode buttons: ensure none pressed in idle (no match on ActiveMode).
        Suppress SaveLastUsedForCurrentBand and RememberLastPersonalityFreq while
          idle (e.g. FrequencyHz<=0 or !session-started). Hard gate so property-change
          storms during ctor cannot poison MSCC_LastUsed.ini / LAST_*.
        MainViewModel ctor seed that assumes 7.1->40m: tolerate freq 0 / band "?".
        Frequency display: show 0.000000 (or blank) — Stew said "all 0".
        Do not invent a tune on window load; wait for Start + server / user band click.

      Optional one-time: do NOT auto-migrate/wipe user INI in code; Stew can delete
      poisoned 40M_* or we note in verify to reset 40m DIG-U after fix.

      ## Out of scope
      Avalonia idle defaults (later block)
      Changing digi ship LAST defaults again
      Remote mic slider

      ## Verify
      1) Cold start MSCC before Start: VFO shows 0, no band gold, no mode pressed.
         mscc.log must NOT show SaveLastUsed 40m/7100000 during load.
      2) Set several bands DIG-U + freqs; Stop; restart app; Start — each band
         restores DIG-U and last freq (40m must not force 7.100/USB).
      3) cmd-023 identity ask / LAST digi defaults still OK.

      Bump ClientVersion (9.21.3 -> 9.21.4).
      Commit hint: cmd-024: idle UI freq 0 no band/mode; stop last-used poison
