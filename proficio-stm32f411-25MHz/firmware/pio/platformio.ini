; Proficio on STM32F411 Black Pill — PlatformIO
; Build:  cd firmware/pio && pio run
; Upload: pio run -t upload

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

build_flags =
    -D PROFICIO_FW_NAME=\"proficio-stm32f411-25MHz\"
    -D PROFICIO_CW_MKII=1
    -D USE_HAL_DRIVER
    -D STM32F411xE
    -D HSE_VALUE=25000000U
    -D CFG_TUSB_MCU=OPT_MCU_STM32F4
    -D CFG_TUSB_OS=OPT_OS_NONE
    -D CFG_TUSB_RHPORT0_MODE=OPT_MODE_DEVICE
    -D BOARD_TUD_RHPORT=0
    -I include
    -I third_party_tinyusb/src

extra_scripts =
    pre:extra_tinyusb.py

; HSE 25 MHz → PLLM=25, N=336, P=/4 → 84 MHz SYSCLK; Q=7 → 48 MHz USB
board_build.f_cpu = 84000000L
board_build.hse_value = 25000000
