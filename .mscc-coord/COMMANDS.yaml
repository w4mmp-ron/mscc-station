- id: cmd-009
    created: "2026-09-20T11:25:00-04:00"
    target: [windows-new-hp]
    role: server+client
    action: win-ms-sdr-0xb2-packed-multus-log-wpf-atu-ptt
    status_hint: done
    detail: |
      Host: windows-new-hp (NEW-HP-LAPTOP).
      Checkout: C:\Users\n8vet\OneDrive\Documents\GitHub\mscc-station
      Orders on this host (no pull required to start). Stew pushes after commit.

      Context: Windows ms-sdr still double-sends CMD_GET_SET_FIRMWARE_VERSION (0xB2) as
      major then minor. WPF decodes each UDP int as major=(v&0xFF) minor=((v>>8)&0xFF),
      so the second packet (minor alone) shows as e.g. FW: 151.0 instead of 2.151.
      Linux ms-sdr already sends ONE packed word: (minor<<8)|major. Match that.

      Stew scope for THIS laptop:
        1) Windows ms-sdr: one packed 0xB2 to client (like Linux)
        2) Log: "Proficio found" Ã¢â€ â€™ "Multus radio found"
        3) WPF WindowTitle: show correct FW (follows from #1) AND add ATU/PTT block when major maps
      Out of scope here: Avalonia / Ubuntu amd64 / RPi arm64 (follow-on after this lands).

      ## A) Windows ms-sdr Ã¢â‚¬â€ pack 0xB2 (required)

      Tree: mscc-ui/windows-work-tree/ms-sdr-MKII/source/

      Mirror linux/ms-sdr-linux/source/ (usbcmd.c srGetVersion + main-controller.c + extern.h + main.c):

      1. Add `int G_firmware_version_packed` (extern.h + main.c init 0).
      2. In usbcmd.c `srGetVersion`:
         - Port Linux unpack of the 16-bit USB word (detect pe0fko vs Proficio byte order;
           see linux usbcmd.c ~298Ã¢â‚¬â€œ329). Do NOT keep Windows-only `major=hi, minor=lo` blindly.
         - Set `G_firmware_version_packed = ((minor << 8) & 0xff00) | (major & 0x00ff)`.
         - Log raw + major.minor + packed like Linux.
      3. In main-controller.c BOTH places that send FW to GUI (~1486Ã¢â‚¬â€œ1487 and case
         CMD_GET_SET_FIRMWARE_VERSION ~2228Ã¢â‚¬â€œ2230):
         - DELETE the second Gui_send_param.
         - Send ONCE: Gui_send_param(CMD_GET_SET_FIRMWARE_VERSION, G_firmware_version_packed);
         - Fallback if packed==0 && (major||minor): rebuild packed from G_major/G_minor.
         - Update log lines to include packed hex.
      4. Do not change opcode number (still 0xB2). Do not change client decode in MSCC.Core
         (already correct for packed words).

      ## B) Log string (required)

      File: mscc-ui/windows-work-tree/ms-sdr-MKII/source/usbcmd.c (~srOpen)
      Change: `Proficio found` Ã¢â€ â€™ `Multus radio found`
      Only this ms-sdr USB-open line for this cmd (not Pulse "Proficio Found" in mscc-init
      unless you see the same string in the active Windows server path Ã¢â‚¬â€ prefer the usbcmd.c
      line Stew cares about).

      ## C) WPF WindowTitle ATU/PTT (include Ã¢â‚¬â€ Stew wants it with this pass)

      Files:
        mscc-ui/windows-work-tree/mscc-mscc/mscc-new/src/MSCC.Wpf/ViewModels/MainViewModel.cs
        (decode already in MSCC.Core UdpRadioService 0xB2 Ã¢â€ â€™ "major.minor")

      Today: `MSCC WPF Ã¢â‚¬â€ MSCC: Ã¢â‚¬Â¦   Core: Ã¢â‚¬Â¦   FW: {FirmwareVersion}`

      Add variant suffix from FW major when applicable:
        | Major | Suffix |
        | 3 or 8 | PTT |
        | 4 or 7 | ATU |
        | else | omit (no extra token) |

      Example: `Ã¢â‚¬Â¦   FW: 7.151   ATU` or `Ã¢â‚¬Â¦   FW: 8.232   PTT` or `Ã¢â‚¬Â¦   FW: 2.151` (no suffix).

      Implementation hint: parse major from FirmwareVersion string (or keep int when
      FirmwareVersionReported fires Ã¢â‚¬â€ optional small Core event enhancement OK if cleaner).
      Keep FirmwareVersion property as "major.minor" only; append ATU/PTT in WindowTitle.

      Avalonia: leave for later host (ubuntu-stew / rpi) unless a one-line shared helper in
      MSCC.Core is trivial and both UIs can call it Ã¢â‚¬â€ prefer WPF-only this cmd if shared
      would drag Avalonia.

      ## D) Verify

      - Rebuild Windows ms-sdr; connect a Multus radio (or Geminus MKII).
      - ms-sdr log: one 0xB2 send with packed value; "Multus radio found"; Transceiver
        Firmware Version major.minor still sensible (e.g. 2.151 / 5.120 / 7.151).
      - WPF title FW matches radio (not 151.0). ATU/PTT appears for majors 3/4/7/8.
      - ACK .mscc-coord/status/windows-new-hp.md; commit on this host. Stew pushes.

      Do not touch linux/ or rpi/ trees in this cmd. Do not change PSoC firmware.

