commands:
  - id: cmd-008
    created: "2026-09-18T15:25:00-04:00"
    target: [ubuntu-stew]
    role: client
    action: ship-avalonia-0.6.56-amd64-installers-linux
    detail: |
      Host: ubuntu-stew. Checkout: /home/stew/Documents/GitHub/mscc-station.
      Orders on this host (no pull required to start). Source Version is already 0.6.56
      (commit 471f603); installers/linux still has mscc-ui_0.6.54_amd64.deb only.

      Goal: Build Avalonia **mscc-ui 0.6.56 amd64**, drop into installers/linux/, verify the
      linux + rpi installer sets are complete and version-aligned for the UI, commit, Stew pushes.

      Steps:
      1) Confirm csproj <Version>0.6.56</Version>
      2) ./linux-build/mscc-ui-x64.sh
      3) ./linux-build/build-mscc-ui-deb-amd64.sh
         (packaging DEBIAN/control may currently say arm64 from Pi build — amd64 script must
          set Architecture: amd64 and Version: 0.6.56)
      4) ./linux-build/drop-installers.sh linux
      5) Verify installers/linux/ contains at least:
           mscc-ui_0.6.56_amd64.deb   (NEW — replace 0.6.54)
           mscc_1.0.43_amd64.deb
           mscc-portaudio_19.8.2_amd64.deb
           mscc-init-gui_1.0.13_all.deb
         And installers/rpi/ still has mscc-ui_0.6.56_arm64.deb (do not delete/rebuild unless broken).
      6) Optional: dpkg-deb -I installers/linux/mscc-ui_0.6.56_amd64.deb | grep -E Version|Architecture
      7) Commit kits + any packaging fixes. ACK status/ubuntu-stew.md.
         Stew pushes via GitHub GUI (or push if credentials work).

      Do not change server C trees. Do not regress arm64 0.6.56 on Pi.
    status_hint: pending

  - id: cmd-007
    created: "2026-09-18T14:25:00-04:00"
    target: [rpi]
    role: client
    action: avalonia-prefer-pulse-vac-devices
    status_hint: done
    detail: |
      Host: rpi. Checkout: /home/pi/src/mscc-station. Orders on this host (no pull required).

      ## Proven on this Pi (Build Commander 2026-09-18)
      WSJT-X Sound Out = Pulse sink **VirtualB** (correct).
      MSCC Remote Digital mic stuck on **VirtualB_monitor** but still no RF.
      PortAudio device list has BOTH:
        - api=ALSA index ~9  name VirtualB_monitor  (pipewire-alsa PCM) — capture peak ~70 with tone on VirtualB
        - api=Pulse index ~25 name VirtualB.monitor — capture peak 20000 with same tone
      Avalonia saved REMOTE_MIC_DEV=9 (ALSA) → remote_mic UDP peaks ~30–60 (noise) → PTT OK, no RF.
      FindNamed after 0.6.55 correctly prefers *monitor* names but picks ALSA VirtualB_monitor first
      (appears earlier than Pulse VirtualB.monitor). That ALSA PCM does **not** hear Pulse VirtualB.

      Same risk for play: prefer Pulse **VirtualA** over ALSA VirtualA duplex ghost.

      ## Fix
      1) When resolving digi VAC (FindNamedAfDevice / device lists), **prefer PulseAudio host API**
         devices over ALSA when both match the same logical name (normalize . ↔ _).
         Mic: Pulse VirtualB.monitor beats ALSA VirtualB_monitor.
         Play: Pulse VirtualA beats ALSA VirtualA.
      2) Optionally de-prioritize ALSA Virtual* entries with absurd channel counts (in=64/out=64)
         when a Pulse counterpart exists.
      3) Log chosen device: hostApi + index + name on R-Digital start.
      4) Bump 0.6.55 → 0.6.56, install arm64 on this Pi, ACK status/rpi.md.
      5) Keep digital-microphone.ini = VirtualB.monitor. No MSCC_Digi_Mic requirement.

      Verify: WSJT Out=VirtualB + Tune → Shack remote_mic peaks thousands, not ~50.
    status_hint: pending

  - id: cmd-006
    created: "2026-09-18T14:05:00-04:00"
    target: [rpi]
    role: client
    action: avalonia-remote-digital-vac-match-fix
    detail: |
      Host: rpi. Checkout: /home/pi/src/mscc-station.
      (Retargeted 2026-09-18: orders live on the working host — no pull required to start.)
      Supersedes cmd-005 (include its PortAudio prefer work here — do not wait on a separate cmd-005 run).

      ## Symptoms (Pi Avalonia → Shack R-Digital)
      - RX OK (VirtualA → WSJT VirtualA.monitor).
      - TX: radio keys (CAT PTT) but Shack remote_mic peaks stay ~20–70 (no digi tone / no RF).
      - Remote AF mic combo: user can pick VirtualB_monitor but it **snaps back to VirtualB**.
      - Root cause in FindNamedAfDevice (MainViewModel.cs):
          want.StartsWith(key)  with want="VirtualB.monitor" and key="VirtualB"
          → first hit is the **sink** VirtualB, not VirtualB.monitor / VirtualB_monitor.
      - MicDevice_Changed then calls ApplyRemoteAfDevicesAndRestart → re-resolves from
        digital-microphone.ini via broken FindNamed → overwrites user selection.
      - Also: client often loads Debian ALSA-only libportaudio instead of mscc-portaudio
        at /usr/local/lib (Pulse). ALSA PCM for B capture must be VirtualB_monitor (underscore);
        dots are illegal in ALSA PCM names (see linux/helpers/99-mscc-virtual.conf).

      Canonical digi cable (do not invent MSCC_Digi_Mic as the required UI name):
        MSCC play → VirtualA
        WSJT In  → VirtualA.monitor
        WSJT Out → VirtualB          (sink — not VirtualB_monitor)
        MSCC mic → VirtualB.monitor  (Pulse) / VirtualB_monitor (ALSA name)

      ## Required fixes

      ### A) FindNamedAfDevice — exact / longest match (CRITICAL)
      File: mscc-ui/Avalonia-Migration/src/MSCC.Avalonia/ViewModels/MainViewModel.cs
      Replace the StartsWith-short-key logic. Prefer:
        1) Exact case-insensitive match on device name (and ToMatchKey)
        2) Normalize '.' ↔ '_' so VirtualB.monitor ≡ VirtualB_monitor
        3) Among partial matches, pick the **longest** matching name (so monitor wins over VirtualB)
        4) For mic lists: prefer names containing ".monitor" or "_monitor" when the saved key
           asks for a monitor; never return a 0-input sink when a monitor candidate exists
        5) Remove `want.StartsWith(key)` as written — it is what selects VirtualB first
      Unit-style smoke: want=VirtualB.monitor must resolve to VirtualB.monitor or VirtualB_monitor,
      never bare VirtualB, when both exist in the list.

      ### B) Remote Digital combo must stick
      RemoteAfWindow digi path: after user changes mic/play combo, either
        - apply the selected device index directly (do not re-FindNamed over the user’s pick), or
        - FindNamed with the fixed matcher and SelectByTag must land on the monitor
      RefreshPath / ApplyRemoteAfDevices must show VirtualB.monitor (or VirtualB_monitor) when
      digital-microphone.ini is VirtualB.monitor — no snap-back to VirtualB.

      ### C) PortAudioNative prefer mscc-portaudio (from cmd-005)
      File: RemoteAudio/PortAudioNative.cs
      Before bare TryLoad("libportaudio.so.2"), try absolute:
        /usr/local/lib/libportaudio.so.2, /usr/local/lib/libportaudio.so,
        then optional $HOME/portaudio-install/lib/..., then bare names.
      Log once which path loaded.

      ### D) mscc-ui launcher LD_LIBRARY_PATH (from cmd-005)
      File: packaging/mscc-ui/usr/bin/mscc-ui
      Order: APPDIR : /usr/local/lib : prior LD_LIBRARY_PATH (same idea as mscc.sh).

      ### E) ALSA conf packaging sanity
      Ensure packaged/installed 99-mscc-virtual.conf uses pcm.VirtualB_monitor (underscore),
      NOT pcm."VirtualB.monitor". Repo helpers/99-mscc-virtual.conf is the reference.
      Pi live /etc was wrong once; packaging must not reintroduce the dotted PCM name.

      ### F) Version + kits
      Bump Avalonia 0.6.54 → 0.6.55 (or next patch). Ship amd64 kit; arm64 for Pi if scripts allow.
      ACK status/ubuntu-stew.md. Commit; Norman pushes via GitHub GUI.
      Do not require MSCC_Digi_Mic in the UI. Do not touch server C / radio opcodes.

      Verify on stew if Pulse VirtualA/B exist: Remote Digital mic resolves to monitor and sticks
      when user re-selects; log line R-Digital VAC ... mic=... idx= must not point at bare VirtualB.
    status_hint: done

