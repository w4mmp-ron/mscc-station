# MSCC remote operator mic (Windows MsccRemotePhones → Pi sdrcore-trans)
# Copy/edit under $HOME/.local/mscc/remote-mic.ini
#
# Mic path is selected by the client:
#   CMD_SET_AUDIO_DEVICE 0 = Digital (local digi)
#   CMD_SET_AUDIO_DEVICE 1 = Phones (local operator mic)
#   CMD_SET_AUDIO_DEVICE 2 = Remote (MSA1 UDP) when Phones + REMOTE AUDIO
#
# This file only sets the UDP listen port (ENABLED is ignored if present).
#
PORT=9101
