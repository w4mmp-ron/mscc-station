# mscc Zero build: dummy operator audio for a Pi with no sound card (zero2).
# Gives recv a speaker and trans a microphone that are always there:
#   OperatorNull     speaker (sound goes nowhere)
#   OperatorNullMic  microphone (silence)
# Pick them in MSCC Init as the operator audio. Low session priority so they
# never become the desktop's default device.
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "OperatorNull"
            node.description = "OperatorNull"
            media.class      = "Audio/Sink"
            audio.position   = [ FL FR ]
            audio.rate       = 48000
            priority.session = 1
            priority.driver  = 1
            object.linger    = true
        }
    }
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "OperatorNullMic"
            node.description = "OperatorNullMic"
            media.class      = "Audio/Source/Virtual"
            audio.position   = [ MONO ]
            audio.rate       = 48000
            priority.session = 1
            priority.driver  = 1
            object.linger    = true
        }
    }
]
