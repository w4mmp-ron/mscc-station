         (packaging DEBIAN/control may currently say arm64 from Pi build â€” amd64 script must
          set Architecture: amd64 and Version: 0.6.56)
      4) ./linux-build/drop-installers.sh linux
      5) Verify installers/linux/ contains at least:
           mscc-ui_0.6.56_amd64.deb   (NEW â€” replace 0.6.54)
