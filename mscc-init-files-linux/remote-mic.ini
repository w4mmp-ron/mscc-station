# MSCC remote operator mic (Windows MsccRemotePhones → Pi sdrcore-trans)
# Copy/edit under $HOME/.local/mscc/remote-mic.ini
#
# When operator selects Phones (P):
#   ENABLED=1 → use MSA1 UDP mic (default port 9101)
#   ENABLED=0 → use local operator microphone
# Digital (D) is never on this path.
#
ENABLED=0
PORT=9101
