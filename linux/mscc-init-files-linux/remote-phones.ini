# MSCC remote operator phones (Pi → Windows MsccRemotePhones)
# Copy/edit under $HOME/.local/mscc/remote-phones.ini
# Digi is NOT on this path — phones AF only.
#
# ENABLED=1 to stream; HOST = operator PC IP running MsccRemotePhones / client
# MONITOR=0 mute radio phones while streaming (default). MONITOR=1 keep shack speaker.
ENABLED=0
HOST=192.168.1.100
PORT=9100
MONITOR=0
