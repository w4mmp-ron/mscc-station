commands:
  - id: cmd-002
    created: "2026-09-17T14:15:00-04:00"
    target: [rpi]
    role: server
    action: align-pi-remote-af-config-to-ubuntu
    detail: |
      Host: raspberrypi. Checkout: /home/pi/src/mscc-station.
      Problem: Win11→Pi remote AF — RX ~+10 dB noise floor, Phone SSB TX much hotter than Win11→Ubuntu.
      Hypothesis: Pi ~/.local/mscc config (drive/ALC/remote-phones), not linux/ vs rpi/ source.

      Do NOT edit repo source trees for this command. Config files under ~/.local/mscc only.
      Norman: no backup required.

      Steps:
      2) Edit ~/.local/mscc/power.ini so USB_POWER=50 and LSB_POWER=50
         (match Ubuntu). Leave TUNE_POWER=100 and other modes unless clearly wrong.
      3) Edit ~/.local/mscc/user_controls.ini so ALC_VALUE=0 (match Ubuntu).
      4) Create ~/.local/mscc/remote-phones.ini (Pi was missing it; Ubuntu has it):
            # MSCC remote operator phones
            ENABLED=1
            HOST=<Win11-client-LAN-IP>
            PORT=9100
            MONITOR=0
         Use the Win11 PC LAN IP that runs the client / MsccRemotePhones.
         If unknown, ask Norman — Ubuntu radio used HOST=192.168.1.228 earlier; confirm before writing.
         Also create ~/.local/mscc/remote-mic.ini with PORT=9101 if missing (ENABLED ignored).
      Then: restart MSCC servers (mscc stop && mscc start, or equivalent).
      Report in status/rpi.md: before/after power.ini + ALC lines, whether remote-phones.ini exists,
      restart OK, and that Norman should retest Win11→Pi Phones+Remote (SSB power + RX floor).
      Do not push/pull for status ACKs. No git commit required for ~/.local/mscc changes.
    status_hint: pending
