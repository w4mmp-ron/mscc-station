commands:
  - id: cmd-019
    created: "2026-09-20T20:35:00-04:00"
    target: [windows-new-hp]
    role: server+client
    action: reset-paths-use-fw-major-factory
    status_hint: pending
    detail: |
      Host: windows-new-hp. Checkout: C:\Users\n8vet\OneDrive\Documents\GitHub\mscc-station
      Orders on this host. Follow-on to cmd-018.

      ## Stew (2026-09-20)
      - Freq cal lives on PSoC; **FREQ CAL → Reset** must reload PPM for the **connected** radio
        (FW major → factory/freq/<line>/) then push to the radio.
      - Settings → **Reset configuration to defaults** must end up with correct **iq + cal**
        for the connected radio (not a generic one-size init-files dump).

      ## Findings (do not skip)
      1) FREQ CAL Reset (CMD_SET_CAL_RESET):
         Delete_PPM_ini() + Create_PPM_ini() keyed off **G_pcb_version** (legacy PCB tables).
         Does **not** use factory/freq/<line>/ or G_major_version.
         reset_type=1 then Freq_Set_Transceiver_Calibration(G_int,G_dec) — good push to PSoC
         **if** G_int/G_dec came from the right factory file.

      2) Settings Reset (SettingsConfigReset_Click):
         Wipes %LocalAppData%\MSCC-NET9, then copies **all** of C:\mscc-net9\init-files\
         including generic iq.ini / freq_cal.ini / power_cal.ini.
         On next ms-sdr start, Factory_seed_live_inis() sees those files **already present**
         and **keeps** them — FW-major factory/ trees never apply. Wrong radio tables stick.

      3) TX IQ "factory reset" (0x8D CMD_SET_IQ_DEFAULTS):
         Forwards to SDRcore built-in defaults — **not** factory/iq/<line>/iq.ini.

      ## Fix A — FREQ CAL Reset (ms-sdr)
      On CMD_SET_CAL_RESET (especially reset_type=1 from UI SetCalResetAsync(true)):
        - Delete live freq_cal.ini
        - Copy factory/freq/<Factory_line_from_major(G_major_version)>/freq_cal.ini → live
          (reuse factory_seed helpers; add Factory_seed_one_force or force-reseed API)
        - Init_PPM()
        - Freq_Set_Transceiver_Calibration(G_int, G_dec)  // push to PSoC
      Do **not** call Create_PPM_ini() PCB switch for this path (keep PCB create only as
      last-resort if factory tree missing, and log loudly).

      ## Fix B — Settings Reset (WPF + seed interaction)
      Preferred:
        - When reseeding from init-files, **exclude** radio-cal files:
          iq.ini, recv-iq.ini, freq_cal.ini, power_cal.ini
          (client UI / audio / comm-port / MSCC_Client.ini etc. still copy)
        - Leave those missing under AppData so next ms-sdr start Factory_seed fills
          by connected FW major.
      Also update the confirm dialog text: radio IQ/freq/QRP reseed from factory for
      the radio present when servers start — not from generic init-files.

      Optional stronger: after wipe, if local ms-sdr will run, delete any leftover
      iq/freq/power under ConfigDirectory explicitly even if init-files had them.

      Sync init-files packaging: remove or stub iq/freq/power from install init-files
      so they are not a footgun (or leave stubs but never copy on Reset — pick one,
      document in factory/README.md).

      ## Fix C — TX IQ Reset All (align with factory trees)
      On 0x8D / ResetAllIqBandsAsync path in ms-sdr:
        - Force-reseed live iq.ini from factory/iq/<line>/
        - Then apply offsets into SDRcore (band loop CMD_SET_IQ_OFFSET + COMMIT, or
          whatever existing load-from-iq.ini path cores use on startup)
      If cores only honor 0x8D internal tables today, implement: reseed file + reload
      into trans the same way startup does after reading iq.ini. Do not leave UI
      claiming "factory" while cores get unrelated DSP defaults.

      ## Out of scope
      Linux/Pi port (follow-on); LAST 14.074/474.2; mic slider; PIN tables.

      ## Verify
      - Ultimus Legacy connected: FREQ CAL Reset → PPM ~+27.66 on UI/PSoC (not PCB junk).
      - Proficio MKII: Reset → ~0.
      - Settings Reset → restart → live iq/freq/power match factory/<connected-line>/
        (log Factory_seed. copied …); client UI settings restored from init-files.
      - TX IQ Reset All → offsets match factory iq for that line (spot-check a few bands).
      - Ordinary restart still does not overwrite tuned live files.

      Bump ms-sdr / ClientVersion as appropriate. ACK status. Commit. Stew pushes.

