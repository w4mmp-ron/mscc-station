- id: cmd-017b
    created: "2026-09-20T16:10:00-04:00"
    target: [windows-new-hp]
    role: client
    action: wpf-connect-safety-on-frequency-reported
    status_hint: done
    detail: |
      Host: windows-new-hp. Checkout: C:\Users\n8vet\OneDrive\Documents\GitHub\mscc-station
      Orders on this host. Tiny follow-on to cmd-017 ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â fix Connect safety race before Stew tests.

      ## Bug
      RetuneIfIllegalForRadioPersonality() runs only from ApplyRadioModelFromFirmware
      (FW 0xB2 path). FrequencyReported only paints ActiveVfo.FrequencyHz.
      If startup freq arrives **after** FW, illegal host freq (e.g. 475 kHz on HF radio)
      sticks and never gets corrected.

      ## Fix
      After FrequencyReported updates freq + SyncBandHighlightFromFrequency, if FW
      personality is already known, run the same illegal-freq retune.

      Preferred shape (match existing FirmwarePersonalityFromRadio pattern):
        1) MainViewModel: after FrequencyReported handler sets freq, raise a small
           event (e.g. FrequencyReportedForConnectSafety / ConnectFreqArrived)
           on UI thread (or let MainWindow Dispatcher.BeginInvoke).
        2) MainWindow: subscribe like FirmwarePersonalityFromRadio; handler calls
           RetuneIfIllegalForRadioPersonality(geminus) using current personality
           (IsGeminusModelSelected() or ViewModel.IsGeminusRadioModel ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â same source
           ApplyRadioModelFromFirmware already set).
        3) Guard: skip if FirmwareVersion is missing/"--" (personality not known yet).
           FW-later path already retunes; FrequencyReported-later path is this fix.
        4) RetuneIfIllegal already no-ops when freq is legal ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â safe to call often.
           Avoid double TuneToFrequency storms: only tune when illegal (already true).

      Alternate equally fine: call retune logic from FrequencyReported inside VM if
      you move the helper next to RememberLastPersonalityFreq ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â but keep one
      implementation, don't fork the illegal threshold (1.8 MHz) or LAST_* defaults.

      Do **not** RememberLastPersonalityFreq on raw FrequencyReported (would sticky
      the illegal host freq). Only client TuneToFrequency remembers (cmd-017).

      ## Out of scope
      Host startup.ini dual keys, Avalonia, mic slider, S/W bank changes.

      ## Verify
      - Leave Geminus on 475 kHz, stop, connect HF radio: lands ~14.000 (or LAST_HF)
        even when monitor shows Frequency reported before/after FW line.
      - Leave HF on 14 MHz, connect Geminus: lands ~475 k (or LAST_LF).
      - Same-radio reconnect with legal freq: no spurious retune.
      - Monitor may show "Connect safety: ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¦" when correction fires.

      Bump ClientVersion patch (9.20.3 ÃƒÂ¢Ã¢â‚¬Â Ã¢â‚¬â„¢ 9.20.4). ACK status. Commit. Stew pushes.

