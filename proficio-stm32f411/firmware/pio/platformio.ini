; Proficio on STM32F411 Black Pill — PlatformIO
; Build:  cd firmware/pio && pio run
; Upload: pio run -t upload

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

build_flags =
    -D PROFICIO_FW_NAME=\"proficio-stm32f411\"
    -D PROFICIO_CW_MKII=1
    -D USE_HAL_DRIVER
    -D STM32F411xE
    -I include

board_build.f_cpu = 96000000L
