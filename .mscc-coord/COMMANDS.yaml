commands:
  - id: cmd-005
    created: "2026-09-17T17:00:00-04:00"
    target: [ubuntu-stew]
    role: client
    action: avalonia-prefer-mscc-portaudio-pulse
    detail: |
      Host: ubuntu-stew. Checkout: /home/stew/Documents/GitHub/mscc-station. git pull first.

      ## Problem (Pi Avalonia → Shack remote digital)
      VirtualA / VirtualB Pulse null sinks exist on Pi; WSJT-X uses SoundIn=VirtualA.monitor /
      SoundOut=VirtualB. Avalonia Remote Digital dropdown does NOT list them because the client
      loads Debian ALSA-only libportaudio.so.2 (/lib/aarch64-linux-gnu/...) instead of
      mscc-portaudio Pulse+ALSA at /usr/local/lib/libportaudio.so.2.
      FindNamedAfDevice fails → REMOTE_*_DEV=-1 → default Sound Blaster mic → remote_mic peaks
      ~30–60 (noise), PTT via CAT works, no digi RF / no WSJT waterfall from radio RX.
      Servers already fix this via mscc.sh LD_LIBRARY_PATH=/usr/local/lib; UI launcher does not.

      Quick repro (optional): without fix, PortAudio sees ~6 ALSA devices only. With
      LD_LIBRARY_PATH=/usr/local/lib, Pulse API appears and VirtualA / VirtualB.monitor show.

      ## Fix (do both belt + suspenders)

      ### A) PortAudioNative.cs
      File: mscc-ui/Avalonia-Migration/src/MSCC.Avalonia/RemoteAudio/PortAudioNative.cs
      In SetDllImportResolver, BEFORE bare TryLoad("libportaudio.so.2"):
        1) Try absolute: /usr/local/lib/libportaudio.so.2
        2) Try absolute: /usr/local/lib/libportaudio.so
        3) Optional: $HOME/portaudio-install/lib/libportaudio.so.2 (legacy layout)
        4) Then existing bare TryLoad names
      Log once (Debug or first successful load path) which path won — helpful on Pi.
      Do not break Windows/macOS (resolver already Linux-oriented; keep non-Linux paths untouched).

      ### B) Packaging launcher mscc-ui
      File: mscc-ui/Avalonia-Migration/packaging/mscc-ui/usr/bin/mscc-ui
      Mirror mscc.sh: if /usr/local/lib/libportaudio.so.2 (or .so) exists, prepend
      /usr/local/lib to LD_LIBRARY_PATH BEFORE $APPDIR (or after APPDIR but ensure
      /usr/local/lib is searched for libportaudio — APPDIR first is fine for Skia;
      put /usr/local/lib second so app natives win, Pulse PortAudio still found).
      Suggested order: APPDIR : /usr/local/lib : previous LD_LIBRARY_PATH
      Keep Terminal=false desktop entry; Env not required if wrapper sets path.

      ### C) Version + kits
      Bump Avalonia patch version (0.6.54 → 0.6.55) in csproj + any packaging version strings.
      Build amd64 kit (existing linux-build scripts) and drop to installers/ubuntu/ (or current amd64 drop path).
      Cross-build OR note follow-on for arm64 Pi kit (installers/rpi/) — prefer shipping both if
      scripts on stew already support arm64; else ship amd64 + ACK that Pi needs arm64 rebuild.

      ### D) Verify
      On stew (amd64 with mscc-portaudio): launch via mscc-ui; Remote Digital device lists must
      include VirtualA (play) and VirtualB.monitor (mic) when those Pulse sinks exist.
      Optional Pi smoke after arm64 install: same dropdown; WSJT VirtualA.monitor/VirtualB;
      Tune → Shack remote_mic peaks rise with digi tone (not ~30–60 floor).

      ACK status/ubuntu-stew.md. Commit code + kits; Norman pushes via GitHub GUI.
      Do not touch server C trees or radio opcodes.
    status_hint: pending

