# MSCC virtual cables as named ALSA PCMs so WSJT-X can select them.
# PipeWire nodes: VirtualA (RX play) / VirtualA.monitor (WSJT-X input)
#                 VirtualB (WSJT-X output) / VirtualB.monitor (trans / Remote AF mic)
#
# Requires pipewire-alsa.

pcm.VirtualA {
	type pipewire
	playback_node "VirtualA"
	hint {
		show on
		description "VirtualA"
	}
}

# ALSA rejects PCM names with a dot. Capture on VirtualA is the monitor.
pcm.VirtualA_monitor {
	type pipewire
	capture_node "VirtualA.monitor"
	hint {
		show on
		description "VirtualA.monitor"
	}
}

pcm.VirtualB {
	type pipewire
	playback_node "VirtualB"
	hint {
		show on
		description "VirtualB"
	}
}

pcm.VirtualB_monitor {
	type pipewire
	capture_node "VirtualB.monitor"
	hint {
		show on
		description "VirtualB.monitor"
	}
}
